{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="header">
    <div style="display:flex; justify-content:space-between; align-items:center; width:80%; margin:auto;">
        <h3>Lost & Found Portal</h3>

        <div>
            <a class="btn" href="/">Home</a>

            {% if user.is_authenticated %}
                <span style="margin-right:10px; color:white;">
                    Hi, {{ user.username }}
                </span>

                <a class="btn" href="/add/">Report Item</a>
                <form method="post" action="/accounts/logout/" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn">Logout</button>
                </form>
            {% else %}
                <a class="btn" href="/register/">Register</a>
                <a class="btn" href="/accounts/login/">Login</a>
            {% endif %}
        </div>
    </div>
</div>
