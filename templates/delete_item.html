{% extends 'base.html' %}

{% block content %}
<div class="header">
    <h2>Confirm Delete</h2>
</div>

<div class="container card" style="max-width:500px; margin:auto; text-align:center;">
    <p>Are you sure you want to delete this item?</p>

    <h3>{{ item.title }} ({{ item.category }})</h3>

    {% if item.image %}
        <img src="{{ item.image.url }}" style="max-width:200px; border-radius:8px;">
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a class="btn" href="/">Cancel</a>
    </form>
</div>
{% endblock %}
