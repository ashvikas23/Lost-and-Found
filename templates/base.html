{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found Portal</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    {% include 'navbar.html' %}

    {% if messages %}
        <div class="container" style="margin-top:15px;">
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}


    {% block content %}
    {% endblock %}

    {% include 'footer.html' %}

</body>
</html>
